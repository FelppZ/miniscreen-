<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Dinâmico - Kuala Lumpur</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #f0f6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 1s ease;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: rgba(22, 27, 34, 0.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Clock Card */
        .clock-card {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .time {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .date-info {
            margin-top: 10px;
            font-size: 1.2rem;
            color: #c9d1d9;
            font-weight: 400;
        }

        .week-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Weather Card */
        .weather-card h3, .spotify-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #c9d1d9;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .weather-current {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .weather-temp {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .weather-details span {
            display: block;
            font-size: 0.9rem;
            color: #c9d1d9;
        }

        .weather-forecast {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 15px;
        }

        .forecast-day {
            text-align: center;
            font-size: 0.85rem;
        }

        .forecast-day i {
            margin: 8px 0;
            font-size: 1.1rem;
        }

        /* Spotify Card */
        .spotify-player {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .album-art {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: #21262d;
            object-fit: cover;
        }

        .track-details .title {
            font-weight: 600;
            font-size: 1rem;
            color: #f0f6fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .track-details .artist {
            font-size: 0.85rem;
            color: #c9d1d9;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #1db954;
            border-radius: 2px;
            transition: width 0.5s linear;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 5px;
        }

        .player-controls button {
            background: none;
            border: none;
            color: #f0f6fc;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .player-controls button:hover {
            color: #1db954;
        }

        .player-controls .play-btn {
            background: #1db954;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .login-prompt {
            text-align: center;
            padding: 20px 0;
        }

        .login-btn {
            display: inline-block;
            background: #1db954;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .time {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Relógio, Data e Fundo Dinâmico -->
        <div class="card clock-card">
            <div class="time" id="clock">00:00:00</div>
            <div class="date-info" id="date">Carregando data...</div>
            <div>
                <span class="week-badge" id="week-number">Semana --</span>
            </div>
        </div>

        <!-- Clima Kuala Lumpur -->
        <div class="card weather-card">
            <h3><i class="fa-solid fa-cloud-sun"></i> Kuala Lumpur</h3>
            <div class="weather-current">
                <div class="weather-temp">32°C</div>
                <div class="weather-details">
                    <span>Parcialmente Nublado</span>
                    <span>Umidade: 78%</span>
                </div>
            </div>
            <div class="weather-forecast" id="forecast"></div>
        </div>

        <!-- Player Spotify Real -->
        <div class="card spotify-card">
            <h3><i class="fa-brands fa-spotify" style="color: #1db954;"></i> Spotify Real</h3>
            <div id="spotify-container">
                <div class="login-prompt" id="login-section">
                    <p style="font-size: 0.9rem; color: #c9d1d9;">Conecte sua conta para ver o que está tocando.</p>
                    <a href="#" id="login-link" class="login-btn">Conectar Spotify</a>
                </div>
                <div class="spotify-player" id="player-section" style="display: none;">
                    <div class="track-info">
                        <img src="" alt="Album Art" class="album-art" id="album-art">
                        <div class="track-details">
                            <div class="title" id="track-title">Nada tocando</div>
                            <div class="artist" id="track-artist">Abra o Spotify</div>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <div class="player-controls">
                        <button onclick="controlSpotify('previous')"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="play-btn" onclick="controlSpotify('play-pause')"><i class="fa-solid fa-play" id="play-icon"></i></button>
                        <button onclick="controlSpotify('next')"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Relógio, Data, Semana e Fundo Dinâmico por Horário
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;

            // Fundo Dinâmico baseado na hora local
            const body = document.body;
            if (hours >= 5 && hours < 12) {
                body.style.background = 'linear-gradient(135deg, #1f2430 0%, #2e2633 50%, #1a2332 100%)'; // Manhã
            } else if (hours >= 12 && hours < 18) {
                body.style.background = 'linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%)'; // Tarde
            } else if (hours >= 18 && hours < 20) {
                body.style.background = 'linear-gradient(135deg, #18121e 0%, #221824 50%, #0d1117 100%)'; // Entardecer
            } else {
                body.style.background = 'radial-gradient(circle at 10% 20%, rgba(29, 185, 84, 0.03) 0%, transparent 40%), #07090e'; // Noite
            }

            // Data
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateString = now.toLocaleDateString('pt-BR', options);
            document.getElementById('date').textContent = dateString.charAt(0).toUpperCase() + dateString.slice(1);

            // Semana
            const startOfYear = new Date(now.getFullYear(), 0, 1);
            const pastDaysOfYear = (now - startOfYear) / 86400000;
            const weekNumber = Math.ceil((pastDaysOfYear + startOfYear.getDay() + 1) / 7);
            document.getElementById('week-number').textContent = `Semana ${weekNumber} do Ano`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // 2. Previsão do Tempo (Kuala Lumpur)
        const daysOfWeek = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        const weatherIcons = ['fa-sun', 'fa-cloud-sun', 'fa-cloud', 'fa-cloud-rain'];
        const forecastContainer = document.getElementById('forecast');
        const todayIndex = new Date().getDay();
        
        for (let i = 1; i <= 4; i++) {
            const nextDayIndex = (todayIndex + i) % 7;
            const randomTemp = Math.floor(Math.random() * (34 - 29 + 1)) + 29;
            const randomIcon = weatherIcons[Math.floor(Math.random() * weatherIcons.length)];
            forecastContainer.innerHTML += `
                <div class="forecast-day">
                    <span>${daysOfWeek[nextDayIndex]}</span>
                    <i class="fa-solid ${randomIcon}" style="color: #58a6ff;"></i>
                    <span>${randomTemp}°C</span>
                </div>
            `;
        }

        // 3. Configuração do Spotify para Localhost (Substitua abaixo pelo seu Client ID)
        const CLIENT_ID = 'SEU_CLIENT_ID_DO_SPOTIFY'; 
        const REDIRECT_URI = 'http://localhost:5500/'; // Ajustado fixo para a porta do Live Server
        const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';

        const loginLink = document.getElementById('login-link');
        loginLink.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}&response_type=token&show_dialog=true`;

        // Capturar o Token da URL após redirecionamento
        const hash = window.location.hash.substring(1).split('&').reduce((initial, item) => {
            if (item) {
                let parts = item.split('=');
                initial[parts[0]] = decodeURIComponent(parts[1]);
            }
            return initial;
        }, {});
        window.location.hash = '';

        let accessToken = hash.access_token;

        if (accessToken) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('player-section').style.display = 'flex';
            fetchCurrentTrack();
            setInterval(fetchCurrentTrack, 3000);
        }

        async function fetchCurrentTrack() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                
                if (response.status === 204 || response.status > 400) {
                    document.getElementById('track-title').textContent = "Nenhuma música ativa";
                    document.getElementById('track-artist').textContent = "Abra o Spotify em um dispositivo";
                    return;
                }

                const data = await response.json();
                if (data && data.item) {
                    document.getElementById('track-title').textContent = data.item.name;
                    document.getElementById('track-artist').textContent = data.item.artists.map(a => a.name).join(', ');
                    document.getElementById('album-art').src = data.item.album.images[0].url;
                    
                    const progressMs = data.progress_ms;
                    const durationMs = data.item.duration_ms;
                    const progressPercent = (progressMs / durationMs) * 100;
                    document.getElementById('progress').style.width = progressPercent + '%';

                    const playIcon = document.getElementById('play-icon');
                    playIcon.className = data.is_playing ? "fa-solid fa-pause" : "fa-solid fa-play";
                }
            } catch (error) {
                console.log("Erro ao buscar dados do Spotify:", error);
            }
        }

        async function controlSpotify(action) {
            let endpoint = '';
            let method = 'PUT';

            if (action === 'next') endpoint = 'next';
            else if (action === 'previous') endpoint = 'previous';
            else if (action === 'play-pause') {
                const isPlaying = document.getElementById('play-icon').classList.contains('fa-pause');
                endpoint = isPlaying ? 'pause' : 'play';
                method = 'PUT';
            }

            try {
                await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
                    method: method,
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                setTimeout(fetchCurrentTrack, 400);
            } catch (error) {
                console.log("Erro ao controlar o player:", error);
            }
        }
    </script>
</body>
</html>
